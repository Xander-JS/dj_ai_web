<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SYSTEM DJ – Boceto sección 4 (mixer central)</title>
<style>
  :root {
    --bg: #f4f4f2;
    --line: #888780;
    --text: #2c2c2a;
    --text-2: #5f5e5a;
    --a-fill: #eeedfe; --a-stroke: #534ab7;
    --b-fill: #e1f5ee; --b-stroke: #0f6e56;
    --n-fill: #f1efe8; --n-stroke: #5f5e5a; --n-text: #444441;
    --sel-fill: #e6f1fb; --sel-stroke: #185fa5; --sel-text: #0c447c;
    --vu-red: #e24b4a; --vu-amber: #ef9f27; --vu-green: #639922;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1c1c1b;
      --line: #888780;
      --text: #f1efe8;
      --text-2: #b4b2a9;
      --a-fill: #3c3489; --a-stroke: #afa9ec;
      --b-fill: #085041; --b-stroke: #5dcaa5;
      --n-fill: #444441; --n-stroke: #b4b2a9; --n-text: #f1efe8;
      --sel-fill: #0c447c; --sel-stroke: #85b7eb; --sel-text: #e6f1fb;
    }
  }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 2rem 1rem;
  }
  svg { width: 100%; max-width: 680px; height: auto; display: block; }
  .frame, .slot, .xf-track { fill: none; stroke: var(--line); }
  .sep { stroke: var(--line); stroke-width: 0.5; }
  .tick { stroke: var(--line); stroke-width: 2; }
  .head { fill: var(--text); font-size: 20px; font-weight: 700; }
  .lbl { fill: var(--text-2); font-size: 12px; }
  .knob-a, .cap-a { fill: var(--a-fill); stroke: var(--a-stroke); }
  .knob-b, .cap-b { fill: var(--b-fill); stroke: var(--b-stroke); }
  .neutral { fill: var(--n-fill); stroke: var(--n-stroke); }
  .neutral-text { fill: var(--n-text); font-size: 12px; }
  .sel { fill: var(--sel-fill); stroke: var(--sel-stroke); }
  .sel-text { fill: var(--sel-text); font-size: 12px; }
  .vu-r { fill: var(--vu-red); } .vu-y { fill: var(--vu-amber); } .vu-g { fill: var(--vu-green); }
</style>
</head>
<body>
<svg viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Boceto sección 4: mixer central</title>
  <desc id="d">Canales CH 1 y CH 2 con perillas Gain, Hi, Mid, Low y Filter, botón Cue, fader y vúmetro; columna Master con perilla, vúmetro estéreo y Mute; crossfader con curvas CP, LIN y CUT.</desc>

  <rect class="frame" x="10" y="10" width="660" height="580" rx="12"/>
  <line class="sep" x1="245" y1="24" x2="245" y2="490" stroke-dasharray="4 4"/>
  <line class="sep" x1="435" y1="24" x2="435" y2="490" stroke-dasharray="4 4"/>

  <text class="head" x="150" y="44" text-anchor="middle">CH 1</text>
  <text class="head" x="530" y="44" text-anchor="middle">CH 2</text>
  <text class="head" x="340" y="44" text-anchor="middle">MASTER</text>

  <g class="knob-a">
    <circle cx="150" cy="78" r="16"/><circle cx="150" cy="134" r="16"/><circle cx="150" cy="190" r="16"/><circle cx="150" cy="246" r="16"/><circle cx="150" cy="302" r="16"/>
  </g>
  <g class="knob-b">
    <circle cx="530" cy="78" r="16"/><circle cx="530" cy="134" r="16"/><circle cx="530" cy="190" r="16"/><circle cx="530" cy="246" r="16"/><circle cx="530" cy="302" r="16"/>
  </g>
  <g class="tick">
    <line x1="150" y1="64" x2="150" y2="72"/><line x1="150" y1="120" x2="150" y2="128"/><line x1="150" y1="176" x2="150" y2="184"/><line x1="150" y1="232" x2="150" y2="240"/><line x1="150" y1="288" x2="150" y2="296"/>
    <line x1="530" y1="64" x2="530" y2="72"/><line x1="530" y1="120" x2="530" y2="128"/><line x1="530" y1="176" x2="530" y2="184"/><line x1="530" y1="232" x2="530" y2="240"/><line x1="530" y1="288" x2="530" y2="296"/>
  </g>

  <g class="lbl" text-anchor="middle">
    <text x="150" y="110">Gain</text><text x="150" y="166">Hi</text><text x="150" y="222">Mid</text><text x="150" y="278">Low</text><text x="150" y="334">Filter</text>
    <text x="530" y="110">Gain</text><text x="530" y="166">Hi</text><text x="530" y="222">Mid</text><text x="530" y="278">Low</text><text x="530" y="334">Filter</text>
  </g>
  <text class="lbl" x="126" y="306" text-anchor="end">LPF</text><text class="lbl" x="174" y="306">HPF</text>
  <text class="lbl" x="506" y="306" text-anchor="end">LPF</text><text class="lbl" x="554" y="306">HPF</text>

  <rect class="neutral" x="125" y="346" width="50" height="22" rx="4"/><text class="neutral-text" x="150" y="361" text-anchor="middle">Cue</text>
  <rect class="neutral" x="505" y="346" width="50" height="22" rx="4"/><text class="neutral-text" x="530" y="361" text-anchor="middle">Cue</text>

  <rect class="slot" x="146" y="380" width="8" height="104" rx="4"/><rect class="cap-a" x="134" y="402" width="32" height="14" rx="3"/>
  <rect class="slot" x="526" y="380" width="8" height="104" rx="4"/><rect class="cap-b" x="514" y="402" width="32" height="14" rx="3"/>

  <rect class="vu-r" x="176" y="380" width="6" height="18"/><rect class="vu-y" x="176" y="400" width="6" height="26"/><rect class="vu-g" x="176" y="428" width="6" height="56"/>
  <rect class="vu-r" x="498" y="380" width="6" height="18"/><rect class="vu-y" x="498" y="400" width="6" height="26"/><rect class="vu-g" x="498" y="428" width="6" height="56"/>

  <circle class="neutral" cx="340" cy="84" r="22"/><line class="tick" x1="340" y1="66" x2="340" y2="76"/>
  <rect class="vu-r" x="328" y="124" width="8" height="40"/><rect class="vu-y" x="328" y="166" width="8" height="70"/><rect class="vu-g" x="328" y="238" width="8" height="198"/>
  <rect class="vu-r" x="344" y="124" width="8" height="40"/><rect class="vu-y" x="344" y="166" width="8" height="70"/><rect class="vu-g" x="344" y="238" width="8" height="198"/>
  <rect class="neutral" x="312" y="450" width="56" height="26" rx="4"/><text class="neutral-text" x="340" y="467" text-anchor="middle">Mute</text>

  <line class="sep" x1="30" y1="498" x2="650" y2="498"/>
  <text class="head" x="196" y="537" text-anchor="end">← A</text>
  <text class="head" x="484" y="537">B →</text>
  <rect class="xf-track" x="220" y="526" width="240" height="8" rx="4"/>
  <rect class="neutral" x="326" y="518" width="28" height="24" rx="3"/>

  <rect class="sel" x="285" y="555" width="36" height="22" rx="4"/><text class="sel-text" x="303" y="570" text-anchor="middle">CP</text>
  <rect class="neutral" x="323" y="555" width="36" height="22" rx="4"/><text class="neutral-text" x="341" y="570" text-anchor="middle">LIN</text>
  <rect class="neutral" x="361" y="555" width="36" height="22" rx="4"/><text class="neutral-text" x="379" y="570" text-anchor="middle">CUT</text>
</svg>
</body>
</html>
